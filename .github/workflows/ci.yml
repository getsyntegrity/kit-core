name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/getsyntegrity/syntegrity-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run CI
        run: syntegrity-ci run --profile go-library
