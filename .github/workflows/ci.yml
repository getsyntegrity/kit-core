name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install forge
        run: |
          curl -fsSL https://github.com/pablogore/devforge/releases/latest/download/forge-linux-amd64 -o forge
          file forge
          chmod +x forge
          sudo mv forge /usr/local/bin/

      - name: Install specs CLI
        run: go install github.com/pablogore/go-specs/cmd/specs@v0.0.8

      - name: Run specs and enforce coverage threshold
        run: |
          go mod download
          specs run -exclude=testkit -- -race -coverprofile=coverage.out
          # Enforce 90% (go tool cover total is last line)
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub(/%/,""); print $3}')
          echo "Coverage total: ${total}%"
          awk -v t="$total" 'BEGIN{if(t==""||t<90){print "Coverage "t"% is below 90%"; exit 1}}' || exit 1

      - name: Run forge CI
        run: forge pr --profile go-lib