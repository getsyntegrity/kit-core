name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/getsyntegrity/syntegrity-ci:0.0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Run CI
        run: syntegrity-ci run --profile go-library