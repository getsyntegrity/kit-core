name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install forge
        run: |
          curl -L https://github.com/devforge/devforge/releases/latest/download/forge-linux-amd64 -o forge
          chmod +x forge
          sudo mv forge /usr/local/bin/

      - name: Run forge CI
        run: forge --profile go-lib